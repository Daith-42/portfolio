# Portfolio David Ameline — site statique servi par nginx (image sans droits root, port 8080).
# Le HTTPS est assuré par Cloudflare, devant le tunnel.

server_tokens off;

map $sent_http_content_type $cache_control {
    default                     "public, max-age=3600";
    ~*text/html                 "no-cache";
    ~*image/                    "public, max-age=604800";
    ~*application/manifest      "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # En-têtes de sécurité, sur toutes les réponses (y compris la 404).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Une seule page : toute autre adresse renvoie une vraie 404 (pas de redirection vers l'accueil).
    location / {
        try_files $uri $uri/ =404;
    }

    # Fichiers cachés : jamais servis.
    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
