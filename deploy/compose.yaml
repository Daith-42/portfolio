# Stack ~/stacks/portfolio sur asushome1 — application publique (modèle B de la fiche serveur).
#
# Ce fichier est installé à la main, une seule fois : la synchronisation automatique ne le
# met JAMAIS à jour. Seuls le site (site/) et la config nginx (nginx/) viennent de la branche prod.
#
# Public par le tunnel commun « asushome1 » : route david-ameline.daith42.fr → http://portfolio:8080.
# Aucun port publié.

services:
  portfolio:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    container_name: portfolio
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

networks:
  web:
    external: true
